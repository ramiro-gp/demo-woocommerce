x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: commerce_local
  WORDPRESS_DB_USER: commerce_local
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
  WORDPRESS_DEBUG: "1"
  LOCAL_SITE_URL: http://localhost:${LOCAL_WP_PORT:?Run scripts/dev.ps1 init first}
  LOCAL_EXPECTED_WORDPRESS_VERSION: "7.1.3"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', getenv('LOCAL_SITE_URL'));
    define('WP_SITEURL', getenv('LOCAL_SITE_URL'));
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('DISALLOW_FILE_EDIT', true);
    define('WP_DEBUG_LOG', '/tmp/wordpress-debug.log');
    define('WP_DEBUG_DISPLAY', false);

services:
  db:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: commerce_local
      MARIADB_USER: commerce_local
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:7.1.3-php8.4-apache@sha256:309307430abf80009378a63a79df73554a6449b700fac59a991b4959e6dda8ca
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment: *wordpress-environment
    secrets:
      - db_password
    ports:
      - "127.0.0.1:${LOCAL_WP_PORT}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/local-mail.php:/var/www/html/wp-content/mu-plugins/000-local-mail.php:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/wp-login.php', false, stream_context_create(['http' => ['follow_location' => 0]])) === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wpcli:
    image: wordpress:cli-2.12.0-php8.4@sha256:668db37ba48bc8d8ec4ca2f22163a1c74d17216c97bf509e327168963a687117
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      LOCAL_ADMIN_USER: ${LOCAL_ADMIN_USER}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/local-mail.php:/var/www/html/wp-content/mu-plugins/000-local-mail.php:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
      - ./docker/tools:/opt/local-tools:ro
      - ./demo/catalog:/opt/demo-catalog:ro
      - ./demo/cart-checkout:/opt/demo-cart-checkout:ro
      - ./.local/${LOCAL_INSTANCE}/backups:/backups

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${LOCAL_MAILPIT_PORT}:8025"
    volumes:
      - mailpit_data:/data

volumes:
  db_data:
  wordpress_data:
  mailpit_data:

secrets:
  db_password:
    file: ./.local/${LOCAL_INSTANCE}/secrets/db-password.txt
  db_root_password:
    file: ./.local/${LOCAL_INSTANCE}/secrets/db-root-password.txt
  wp_admin_password:
    file: ./.local/${LOCAL_INSTANCE}/secrets/wp-admin-password.txt
