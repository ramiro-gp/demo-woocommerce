; LAB only. Production equivalents require verification with the selected host.
memory_limit=256M
upload_max_filesize=32M
post_max_size=40M
max_execution_time=120
display_errors=Off
log_errors=On
error_log=/tmp/h11-php-errors.log
expose_php=Off
session.cookie_httponly=1
session.cookie_samesite=Lax
opcache.enable=1
opcache.validate_timestamps=1
