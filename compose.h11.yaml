# Disposable local hosting simulation. Independent from compose.yaml and all demos.
x-environment: &environment
  WORDPRESS_DB_HOST: h11-db
  WORDPRESS_DB_NAME: h11
  WORDPRESS_DB_USER: h11
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('WP_HOME', getenv('H11_URL'));
    define('WP_SITEURL', getenv('H11_URL'));
services:
  h11-db:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: h11
      MARIADB_USER: h11
      MARIADB_PASSWORD_FILE: /run/secrets/db
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root
    secrets: [db, root]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 40
  h11-web:
    image: wordpress:7.1.3-php8.4-apache@sha256:41815427d043bc629359121b347e2f1e4b7aba502062c369c2922f1d666ebf2a
    environment:
      <<: *environment
      H11_URL: http://localhost:${H11_PORT}
    secrets: [db]
    ports: ["127.0.0.1:${H11_PORT}:80"]
    healthcheck:
      test: [CMD, sh, -c, "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-load.php"]
      interval: 3s
      retries: 40
    volumes:
      - wp:/var/www/html
      - ./deployment/lab-mail.php:/var/www/html/wp-content/mu-plugins/h11-lab-mail.php:ro
      - ./deployment/lab.ini:/usr/local/etc/php/conf.d/zz-h11.ini:ro
      - ./docker/apache/commerce-hardening.conf:/etc/apache2/conf-enabled/zz-commerce.conf:ro
      - ./docker/apache/demo-log-privacy.conf:/etc/apache2/conf-enabled/zz-privacy.conf:ro
    depends_on:
      h11-db: {condition: service_healthy}
  h11-cli:
    image: wordpress:cli-2.12.0-php8.4@sha256:7d9d2d04401f1adcc4c4f6717d7a9763a084c2c54cd70dc4087a6fb58d905fc5
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *environment
      H11_URL: http://localhost:${H11_PORT}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_CLI_CONFIG_PATH: /opt/h11-deployment/lab-wp-cli.yml
    secrets: [db, admin]
    volumes:
      - wp:/var/www/html
      - ./deployment/lab-mail.php:/var/www/html/wp-content/mu-plugins/h11-lab-mail.php:ro
      - ./deployment/lab.ini:/usr/local/etc/php/conf.d/zz-h11.ini:ro
      - ./deployment:/opt/h11-deployment:ro
      - ./tests:/opt/h11-tests:ro
      - ./.local/h11-release:/release:ro
      - ./.local/h11/private:/h11-private
      - ./.local/h11/${H11_INSTANCE}/backups:/h11-backups
  h11-mail:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports: ["127.0.0.1:${H11_MAIL_PORT}:8025"]
volumes:
  db:
  wp:
secrets:
  db: {file: "./.local/h11/${H11_INSTANCE}/secrets/db.txt"}
  root: {file: "./.local/h11/${H11_INSTANCE}/secrets/root.txt"}
  admin: {file: "./.local/h11/${H11_INSTANCE}/secrets/admin.txt"}
