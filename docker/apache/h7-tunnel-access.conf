# Mounted only by the temporary HTTPS overlay. CLI remains available locally.
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
SetEnvIfExpr "%{QUERY_STRING} =~ m#(?:^|&)wc-api=WC_WooMercadoPago_Basic_Gateway(?:&|$)#i || %{REQUEST_URI} =~ m#^/wc-api/WC_WooMercadoPago_Basic_Gateway/?$#i" h7_mp_callback
SetEnvIfExpr "%{QUERY_STRING} =~ m#(?:^|&)wc-api=WC_WooMercadoPago_Basic_Gateway(?:&|$)#i || %{REQUEST_URI} =~ m#^/wc-api/WC_WooMercadoPago_Basic_Gateway/?$#i" h7_mp_kind=core
SetEnvIfExpr "%{QUERY_STRING} =~ m#(?:^|&)topic=merchant_order(?:&|$)# && %{QUERY_STRING} =~ m#(?:^|&)source_news=ipn(?:&|$)#" h7_mp_kind=ipn
SetEnvIfExpr "%{QUERY_STRING} =~ m#(?:^|&)type=payment(?:&|$)# && %{QUERY_STRING} =~ m#(?:^|&)source_news=webhooks(?:&|$)#" h7_mp_kind=webhooks
SetEnvIf X-H7-QA-Replay "^(probe|outage-probe|restored-probe|reconstructed)$" h7_mp_qa=$1
LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t %m %>s %{h7_mp_qa}e %{h7_mp_kind}e" h7_mp_callback_safe
GlobalLog /var/log/apache2/h7-callbacks.log h7_mp_callback_safe env=h7_mp_callback
# Local-only fault switch for a supervised retry test. Never enabled by start.
# The QA operator must schedule removal before creating this /tmp flag.
<If "-f '/tmp/h7-mp-callback-unavailable' && (%{QUERY_STRING} =~ m#(?:^|&)wc-api=WC_WooMercadoPago_Basic_Gateway(?:&|$)#i || %{REQUEST_URI} =~ m#^/wc-api/WC_WooMercadoPago_Basic_Gateway/?$#i)">
    Header always set Retry-After "2"
    Redirect 503 /
</If>
<LocationMatch "^/(?:wp-admin(?:/(?!admin-ajax[.]php$)|$)|wp-login[.]php(?:$|/)|xmlrpc[.]php(?:$|/))">
    Require all denied
</LocationMatch>
