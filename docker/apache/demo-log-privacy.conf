# Query strings may contain WooCommerce order keys or OAuth authorization codes.
# Preserve operational access logs without query strings, referrers or cookies.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" combined
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" common
LogFormat "%v:%p %h %l %u %t \"%m %U %H\" %>s %b" vhost_combined
