# Local Apache rules. Hosting must translate/review these for its actual server.
ServerTokens Prod
ServerSignature Off
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
<Directory /var/www/html>
    Options -Indexes
    <FilesMatch "(?i)(^\.|^wp-config\.php(?:\..*)?$|\.(?:sql|bak|old|orig|log|ini|env|tar|gz|zip)$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    # Intentionally no script/connect allowlist: payment providers need a reviewed policy.
    Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header unset X-Powered-By
</IfModule>
