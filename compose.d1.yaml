# D1: new loopback-only laboratories; never use historical volumes or DB copies.
x-env: &env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: d1_${D1_BRAND}
  WORDPRESS_DB_USER: d1
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db
  D1_URL: http://localhost:${D1_PORT}
  D1_MODE: ${D1_MODE:-0}
  D1_ENV_TYPE: ${D1_ENV_TYPE:-local}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', getenv('D1_ENV_TYPE'));
    define('WP_HOME', getenv('D1_URL'));
    define('WP_SITEURL', getenv('D1_URL'));
    define('COMMERCE_DEMO_PUBLIC', getenv('D1_MODE') === '1');
    define('COMMERCE_DEMO_ALLOWED_HOST', 'localhost');
    define('DISALLOW_FILE_EDIT', true);
    define('WP_DEBUG_DISPLAY', false);
    define('WP_DEBUG_LOG', '/tmp/d1-debug.log');
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('DISABLE_WP_CRON', true);
services:
  db:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: d1_${D1_BRAND}
      MARIADB_USER: d1
      MARIADB_PASSWORD_FILE: /run/secrets/db
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root
    secrets: [db, root]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 50
  web:
    image: wordpress:7.1.3-php8.4-apache@sha256:41815427d043bc629359121b347e2f1e4b7aba502062c369c2922f1d666ebf2a
    environment: *env
    secrets: [db]
    ports: ["127.0.0.1:${D1_PORT}:80"]
    volumes:
      - wp:/var/www/html
      - ./deployment/demo-public/commerce-demo-public.php:/var/www/html/wp-content/mu-plugins/commerce-demo-public.php:ro
      - ./deployment/demo-lab/mail-deny.php:/var/www/html/wp-content/mu-plugins/000-d1-mail.php:ro
      - ./deployment/lab.ini:/usr/local/etc/php/conf.d/zz-d1.ini:ro
      - ./docker/apache/commerce-hardening.conf:/etc/apache2/conf-enabled/zz-commerce.conf:ro
      - ./docker/apache/demo-log-privacy.conf:/etc/apache2/conf-enabled/zz-privacy.conf:ro
      - ./deployment/demo-lab/headers.conf:/etc/apache2/conf-enabled/zz-d1-robots.conf:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, sh, -c, "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-load.php"]
      interval: 3s
      retries: 50
  cli:
    image: wordpress:cli-2.12.0-php8.4@sha256:7d9d2d04401f1adcc4c4f6717d7a9763a084c2c54cd70dc4087a6fb58d905fc5
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_CLI_CONFIG_PATH: /workspace/deployment/lab-wp-cli.yml
    secrets: [db, admin]
    volumes:
      - wp:/var/www/html
      - ./deployment/demo-public/commerce-demo-public.php:/var/www/html/wp-content/mu-plugins/commerce-demo-public.php:ro
      - ./deployment/demo-lab/mail-deny.php:/var/www/html/wp-content/mu-plugins/000-d1-mail.php:ro
      # Only code/tests and the approved clean release; never historical .local data.
      - ./deployment:/workspace/deployment:ro
      - ./tests:/workspace/tests:ro
      - ./.local/h11-release/1.0.0:/workspace/.local/h11-release/1.0.0:ro
      - ./.local/d1/${D1_BRAND}/tools:/opt/d1-tools:ro
      - ./demo/catalog:/opt/demo-catalog:ro
      - ./demo/origen-casa:/opt/client-fixture:ro
      - ./docker/tools:/opt/local-tools:ro
      - ./.local/d1/${D1_BRAND}/private:/d1-private
volumes:
  db:
  wp:
secrets:
  db: {file: "./.local/d1/${D1_BRAND}/secrets/db.txt"}
  root: {file: "./.local/d1/${D1_BRAND}/secrets/root.txt"}
  admin: {file: "./.local/d1/${D1_BRAND}/secrets/admin.txt"}
