# D2 disposable CSV QA. New database/volumes and loopback ports; no catalog clone.
x-env: &env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: d2_bulk
  WORDPRESS_DB_USER: d2
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db
  SELLER_URL: http://localhost:${D2_PORT}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_HOME', getenv('SELLER_URL'));
    define('WP_SITEURL', getenv('SELLER_URL'));
    define('COMMERCE_DEMO_PUBLIC', false);
    define('DISALLOW_FILE_EDIT', true);
    define('WP_DEBUG_DISPLAY', false);
    define('WP_DEBUG_LOG', '/tmp/d2-debug.log');
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('DISABLE_WP_CRON', true);
services:
  db:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: d2_bulk
      MARIADB_USER: d2
      MARIADB_PASSWORD_FILE: /run/secrets/db
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root
    secrets: [db, root]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 50
  web:
    image: wordpress:7.1.3-php8.4-apache@sha256:41815427d043bc629359121b347e2f1e4b7aba502062c369c2922f1d666ebf2a
    environment: *env
    secrets: [db]
    ports: ["127.0.0.1:${D2_PORT}:80"]
    volumes:
      - wp:/var/www/html
      - ./deployment/demo-public/commerce-demo-public.php:/var/www/html/wp-content/mu-plugins/commerce-demo-public.php:ro
      - ./deployment/seller-lab/mail.php:/var/www/html/wp-content/mu-plugins/000-seller-safety.php:ro
      - ./deployment/lab.ini:/usr/local/etc/php/conf.d/zz-seller.ini:ro
      - ./docker/apache/commerce-hardening.conf:/etc/apache2/conf-enabled/zz-commerce.conf:ro
      - ./docker/apache/demo-log-privacy.conf:/etc/apache2/conf-enabled/zz-privacy.conf:ro
      - ./deployment/demo-lab/headers.conf:/etc/apache2/conf-enabled/zz-noindex.conf:ro
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    healthcheck:
      test: [CMD, sh, -c, "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-load.php"]
      interval: 3s
      retries: 50
  mail:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_DATABASE: /data/mailpit.db
    ports: ["127.0.0.1:${D2_MAIL_PORT}:8025"]
    volumes: [mail:/data]
  cli:
    image: wordpress:cli-2.12.0-php8.4@sha256:7d9d2d04401f1adcc4c4f6717d7a9763a084c2c54cd70dc4087a6fb58d905fc5
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_CLI_CONFIG_PATH: /workspace/deployment/lab-wp-cli.yml
    secrets: [db, admin, manager, customer]
    volumes:
      - wp:/var/www/html
      - ./deployment/demo-public/commerce-demo-public.php:/var/www/html/wp-content/mu-plugins/commerce-demo-public.php:ro
      - ./deployment/seller-lab/mail.php:/var/www/html/wp-content/mu-plugins/000-seller-safety.php:ro
      - ./deployment:/workspace/deployment:ro
      - ./tests:/workspace/tests:ro
      - ./.local/d2/import:/seller-import:ro
      - ./.local/d2/private:/seller-private
volumes:
  db:
  wp:
  mail:
secrets:
  db: {file: "./.local/d2/secrets/db.txt"}
  root: {file: "./.local/d2/secrets/root.txt"}
  admin: {file: "./.local/d2/secrets/admin.txt"}
  manager: {file: "./.local/d2/secrets/manager.txt"}
  customer: {file: "./.local/d2/secrets/customer.txt"}
